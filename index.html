<!doctype html>
<html lang="en">
  <head>
    <title>Calculator</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <center>
      <div id="app">
        <h1>Age Calculator</h1>
        <form id="form">
        <input type="date" placeholder="BirthYear" id="In" class="elements" min="1900" required/>
        <br>
        <button id="btn" class="elements" type="button"> Calculate Age </button>
        <br>
        <p id="p" class="elements"></p>            
        </form>

      </div>
    </center>
    <script src="script.js"></script>
  </body>
</html>
